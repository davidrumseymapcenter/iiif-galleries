name: Generate Gallery Index

on:
  push:
    paths:
      - 'galleries/**.json'

jobs:
  generate-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate index.md
        run: |
          cat > index.md << 'FRONTMATTER'
          ---
          layout: default
          ---
          FRONTMATTER
          echo "" >> index.md
          echo "Curated image galleries from the David Rumsey Map Center." >> index.md
          echo "" >> index.md
          echo "Click any title to open in presentation mode." >> index.md
          echo "" >> index.md
          echo '<ul class="gallery-list">' >> index.md
          for file in galleries/*.json; do
            label=$(python3 scripts/get_label.py "$file")
            filename=$(basename "$file")
            if [ -n "$label" ]; then
              url="https://davidrumseymapcenter.github.io/set-builder/presentation.html?file=https://raw.githubusercontent.com/davidrumseymapcenter/iiif-galleries/main/galleries/${filename}"
              echo "<li><a href=\"${url}\" target=\"_blank\">${label}</a></li>" >> index.md
            fi
          done
          echo '</ul>' >> index.md

      - name: Commit updated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.md
          git diff --staged --quiet || git commit -m "Auto-update gallery index"
          git push
